name: Security authorization tests

on:
  push:
    branches:
      - feature/relatorios-linguagem-institucional-20261010
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify TypeScript
        run: npm run lint
      - name: Verify institutional authorization
        run: npm run test:security
