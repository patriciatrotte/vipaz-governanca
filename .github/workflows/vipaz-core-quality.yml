name: VIPAZ Core Quality Gate

on:
  pull_request:
    branches:
      - feature/vipaz-institutional-auth-20261010
  push:
    branches:
      - fix/vipaz-authz-catalog-integration-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-types:
    name: Security regressions and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Institutional security regressions
        run: npm test
      - name: Production build
        run: npm run build
